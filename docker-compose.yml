services:
  db:
    image: mysql:8.0
    container_name: kabale_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSSOWRD:-rootpassword}
      MYSQL_DATABASE: kabale_db
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:
    build: ./backend
    container_name: kabale_backend   
    restart: unless-stopped
    environment:
       DB_HOST: db_data
       DB_NAME: kabale_db
       DB_USER: root
       DB_PASSSOWRD: ${DB_ROOT_PASSWORD:-rootpassword}
       DJANGO_DEBUG: "0"
       DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-hvclmlFCJ1wP9yIo-h4399dq5I7E8th5T-fDj3tLlKKVumDqCwMfO9f0ocx0Va120Wk}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: kabale_frontend
    restart: unless-stopped
    ports:
      - "80:80"

    depends_on:
      - backend  
volumes:
  db_data:      

